networks:
  foxnet:
    name: foxnet

services:
  redis:
    image: redis:7-alpine
    networks:
      - foxnet
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  manager:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/redtailfox", "manager"]
    # Manager needs access to the container runtime socket to spawn workers.
    user: "0:0"
    restart: unless-stopped
    networks:
      - foxnet
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WORKER_IMAGE: "redtailfox:latest"
      WORKER_CONTAINER_PREFIX: "fox_worker"
      WORKER_NETWORK: "foxnet"
      MAX_SLOTS_PER_CONTAINER: "10"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  monitor:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/redtailfox", "monitor"]
    restart: unless-stopped
    networks:
      - foxnet
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CHECK_INTERVAL: "10"
      MAX_SILENCE_SECONDS: "500"
      SLOT_IDLE_TIMEOUT: "600"
      WORKER_TASKS_LIST: "manager_tasks"

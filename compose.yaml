networks:
  foxnet:
    name: foxnet

services:
  redis:
    image: redis:7-alpine@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    networks:
      - foxnet
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # docker-socket-proxy restricts Docker API access so the manager can only
  # manage containers without full daemon control. Disable in development
  # by removing this service and mounting the socket directly into manager.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f3a6f303320723d199d2316a3e82b2e2685d86c275d5e3deeaf182573b47476
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - foxnet
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      POST: "1"

  manager:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/redtailfox", "manager"]
    user: "0:0"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - foxnet
    depends_on:
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
    # NOTE: For production, set REDIS_PASSWORD or mount REDIS_PASSWORD_FILE
    # to secure the Redis connection. The manager propagates credentials to
    # worker containers automatically.
    environment:
      DOCKER_HOST: tcp://socket-proxy:2375
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # REDIS_PASSWORD: ""
      # REDIS_PASSWORD_FILE: /run/secrets/redis_password
      WORKER_IMAGE: "redtailfox:latest"
      WORKER_CONTAINER_PREFIX: "fox_worker"
      WORKER_NETWORK: "foxnet"
      MAX_SLOTS_PER_CONTAINER: "10"
      WORKER_TASKS_LIST: "manager_tasks"

  monitor:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/redtailfox", "monitor"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - foxnet
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # REDIS_PASSWORD: ""
      CHECK_INTERVAL: "10"
      MAX_SILENCE_SECONDS: "500"
      SLOT_IDLE_TIMEOUT: "600"
      WORKER_TASKS_LIST: "manager_tasks"

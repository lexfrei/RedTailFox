networks:
  foxnet:
    name: foxnet

services:
  redis:
    image: redis:7-alpine
    networks:
      - foxnet
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  manager:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/redtailfox", "manager"]
    # Manager needs access to the container runtime socket to spawn workers.
    # For hardened deployments, consider running a docker-socket-proxy
    # (e.g. tecnativa/docker-socket-proxy) to restrict API access.
    user: "0:0"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - foxnet
    depends_on:
      redis:
        condition: service_healthy
    # NOTE: For production, set REDIS_PASSWORD or mount REDIS_PASSWORD_FILE
    # to secure the Redis connection. The manager propagates credentials to
    # worker containers automatically.
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # REDIS_PASSWORD: ""
      # REDIS_PASSWORD_FILE: /run/secrets/redis_password
      WORKER_IMAGE: "redtailfox:latest"
      WORKER_CONTAINER_PREFIX: "fox_worker"
      WORKER_NETWORK: "foxnet"
      MAX_SLOTS_PER_CONTAINER: "10"
      WORKER_TASKS_LIST: "manager_tasks"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  monitor:
    build:
      context: .
      dockerfile: Containerfile
    command: ["/redtailfox", "monitor"]
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    networks:
      - foxnet
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # REDIS_PASSWORD: ""
      CHECK_INTERVAL: "10"
      MAX_SILENCE_SECONDS: "500"
      SLOT_IDLE_TIMEOUT: "600"
      WORKER_TASKS_LIST: "manager_tasks"

version: "3.9"

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  manager:
    build: .
    command: python manager.py
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

  monitor:
    build: .
    command: python monitor.py
    depends_on:
      - redis
